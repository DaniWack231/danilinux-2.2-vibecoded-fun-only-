# ===============================================================
#  Danilinux 2.2 — Aero glass compositor (picom)
#  Delivers the Vista "see through it" effect: real transparency
#  + dual-kawase blur behind menus, the taskbar and tooltips.
# ===============================================================

backend = "glx";
vsync = true;
glx-no-stencil = true;

# ---- soft Vista-style drop shadows ---------------------------
shadow = true;
shadow-radius = 8;
shadow-offset-x = -8;
shadow-offset-y = -7;
shadow-opacity = 0.38;
shadow-exclude = [
  "name = 'Notification'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'xfdesktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ---- smooth fades (Vista menu animation feel) ------------------
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
no-fading-openclose = false;

# ---- THE GLASS: blur whatever shines through -------------------
blur: {
  method = "dual_kawase";
  strength = 8;
}
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "class_g = 'xfdesktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# ---- per-window-type glass (menus, popups, tooltips) -----------
winttypes:
{
  dropdown_menu = { opacity = 0.94; blur-background = true; };
  popup_menu    = { opacity = 0.94; blur-background = true; };
  menu          = { opacity = 0.94; blur-background = true; };
  tooltip       = { opacity = 0.92; blur-background = true; };
  utility       = { opacity = 0.96; };
  notification  = { opacity = 0.85; };
  dock          = { blur-background = true; };
};

# keep browser/game content presented directly (no tearing tricks)
unredir-if-possible = false;
